# PR-gated production deploy.
#
# Flow: `main` is branch-protected — every change lands via a reviewed and
# approved pull request. Once a PR merges, this workflow builds+pushes
# `:latest` images to the GitHub Container Registry (ghcr.io) and triggers a
# Portainer stack webhook to redeploy. Pushing a `vX.Y.Z` tag (or manually
# dispatching against one) does the same build+deploy AND additionally tags
# the images with that version and creates a GitHub Release — use a tag when
# a change should also be a named, pinned release.
#
# What this workflow does NOT do:
#   - It does not manage the backend's runtime environment variables. Those are
#     injected into the running containers via a Docker Swarm secret
#     (`apartamentos_backend_env`, mounted at /run/secrets/backend.env) that is
#     created once, directly on the target node, out of band from CI/CD — see
#     DEPLOY_SECRET.md. This workflow never reads or writes that secret.
#   - It does not create the Portainer stack or its webhook. Both are one-time
#     manual setup steps in the Portainer UI (Stacks -> your stack -> Webhook):
#     Portainer generates the webhook URL, which then gets stored here as the
#     PORTAINER_WEBHOOK_URL repo secret. GitHub Actions has no way to create
#     that webhook itself.
#   - It relies on the stack's compose file using the `:latest` tag (the
#     default in docker-compose.yml) and on Portainer re-pulling images when
#     the webhook fires. If the Portainer stack should instead run a pinned
#     version, set the stack's BACKEND_IMAGE_TAG / FRONTEND_IMAGE_TAG
#     environment variables in Portainer to the released tag (e.g. `v1.4.2`)
#     — the webhook alone does not change which tag the stack is pinned to.
#   - The only repo secret this workflow requires is PORTAINER_WEBHOOK_URL.
#     (VITE_GOOGLE_CLIENT_ID / VITE_OAUTH_PROD_URL were removed — the frontend
#     never reads them; Google OAuth is entirely backend-driven.)
#   - GHCR packages are private by default. For Portainer to pull them, pick one:
#       (a) make the package public from its GitHub package settings after the
#           first push (Settings -> Packages -> apartamentos-backend/-frontend
#           -> Change visibility) — simplest, no Portainer-side config needed; or
#       (b) add a registry credential in Portainer (Registries -> Add registry,
#           ghcr.io, using a GitHub Personal Access Token with `read:packages`
#           scope as the password) if the packages should stay private.
#     This workflow doesn't decide between them — pick whichever fits.

name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

env:
  BACKEND_IMAGE: ghcr.io/fer336/apartamentos-backend
  FRONTEND_IMAGE: ghcr.io/fer336/apartamentos-frontend

jobs:
  context:
    runs-on: ubuntu-latest
    outputs:
      is_tag: ${{ steps.ctx.outputs.is_tag }}
      version_tag: ${{ steps.ctx.outputs.version_tag }}
    steps:
      - id: ctx
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            if [[ ! "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Ref '${{ github.ref_name }}' does not match the required release tag format vX.Y.Z (e.g. v1.4.2). Refusing to build or deploy."
              exit 1
            fi
            echo "Tag '${{ github.ref_name }}' is a valid release version."
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
            echo "version_tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            echo "version_tag=" >> "$GITHUB_OUTPUT"
          fi

  build-backend:
    needs: [context]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image (main)
        if: needs.context.outputs.is_tag != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:latest

      - name: Build and push backend image (release)
        if: needs.context.outputs.is_tag == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ needs.context.outputs.version_tag }}

  build-frontend:
    needs: [context]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image (main)
        if: needs.context.outputs.is_tag != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            VITE_BACKEND_URL=

      - name: Build and push frontend image (release)
        if: needs.context.outputs.is_tag == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ needs.context.outputs.version_tag }}
          build-args: |
            VITE_BACKEND_URL=

  release:
    needs: [context, build-backend, build-frontend]
    if: needs.context.outputs.is_tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.context.outputs.version_tag }}
          generate_release_notes: true

  deploy:
    needs: [build-backend, build-frontend, release]
    if: always() && needs.build-backend.result == 'success' && needs.build-frontend.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer stack redeploy
        run: curl -fsS -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
