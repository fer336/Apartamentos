# PR-gated, auto-versioned production deploy.
#
# Flow: `main` is branch-protected — every change lands via a reviewed and
# approved pull request. Once a PR merges, this workflow:
#   1. Computes the next release version by bumping the patch number of the
#      latest `vX.Y.Z` git tag (v0.3.12 -> v0.3.13). Pushing a `vX.Y.Z` tag
#      manually instead (or dispatching against one) skips this auto-bump and
#      uses that exact tag — use this for an intentional minor/major bump.
#   2. Builds+pushes the backend/frontend images tagged with that version
#      (and `:latest`, kept for convenience/manual pulls) to ghcr.io.
#   3. Creates the git tag (if it didn't already exist) and a GitHub Release.
#   4. Rewrites docker-compose.yml's `image:` lines to pin that exact version
#      and commits that change straight to `main` — bypassing the PR
#      requirement, since this is a narrow, fully automated, auditable commit
#      (uses DEPLOY_ADMIN_TOKEN, not the default bot token; see below). The
#      commit message carries `[skip ci]` so it doesn't re-trigger this
#      workflow.
#   5. Triggers the Portainer stack webhook. Because the stack is git-based,
#      Portainer re-pulls docker-compose.yml from `main` — now pinned to the
#      new version — and redeploys with it. No Portainer API call needed.
#
# What this workflow does NOT do:
#   - It does not manage the backend's runtime environment variables. Those are
#     injected into the running containers via a Docker Swarm secret
#     (`apartamentos_backend_env`, mounted at /run/secrets/backend.env) that is
#     created once, directly on the target node, out of band from CI/CD — see
#     DEPLOY_SECRET.md. This workflow never reads or writes that secret.
#   - It does not create the Portainer stack or its webhook. Both are one-time
#     manual setup steps in the Portainer UI (Stacks -> your stack -> Webhook):
#     Portainer generates the webhook URL, which then gets stored here as the
#     PORTAINER_WEBHOOK_URL repo secret. GitHub Actions has no way to create
#     that webhook itself.
#   - GHCR packages are private by default. For Portainer to pull them, pick one:
#       (a) make the package public from its GitHub package settings after the
#           first push (Settings -> Packages -> apartamentos-backend/-frontend
#           -> Change visibility) — simplest, no Portainer-side config needed; or
#       (b) add a registry credential in Portainer (Registries -> Add registry,
#           ghcr.io, using a GitHub Personal Access Token with `read:packages`
#           scope as the password) if the packages should stay private.
#     This workflow doesn't decide between them — pick whichever fits.
#
# Required repo secrets:
#   - PORTAINER_WEBHOOK_URL — the stack's redeploy webhook (Portainer UI).
#   - DEPLOY_ADMIN_TOKEN — a Personal Access Token belonging to a repo admin,
#     with Contents: Read and write on this repo (fine-grained PAT). Needed
#     only for step 4 above: the default GITHUB_TOKEN acts as a bot, not an
#     admin, so branch protection would block it from pushing to `main` even
#     with enforce_admins disabled — that exemption only covers real admins.

name: Deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

env:
  BACKEND_IMAGE: ghcr.io/fer336/apartamentos-backend
  FRONTEND_IMAGE: ghcr.io/fer336/apartamentos-frontend

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      is_new_tag: ${{ steps.compute.outputs.is_new_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: compute
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            tag="${{ github.ref_name }}"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Ref '$tag' does not match the required release tag format vX.Y.Z (e.g. v1.4.2). Refusing to build or deploy."
              exit 1
            fi
            echo "Tag '$tag' is a valid release version, using it as-is."
            echo "version=$tag" >> "$GITHUB_OUTPUT"
            echo "is_new_tag=false" >> "$GITHUB_OUTPUT"
          else
            latest="$(git tag -l 'v*.*.*' | sort -V | tail -n1)"
            if [[ -z "$latest" ]]; then
              next="v0.1.0"
            else
              IFS='.' read -r major minor patch <<< "${latest#v}"
              next="v${major}.${minor}.$((patch + 1))"
            fi
            echo "Latest tag: '${latest:-none}'. Auto-bumping to '$next'."
            echo "version=$next" >> "$GITHUB_OUTPUT"
            echo "is_new_tag=true" >> "$GITHUB_OUTPUT"
          fi

  build-backend:
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ needs.version.outputs.version }}

  build-frontend:
    needs: [version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ needs.version.outputs.version }}
          build-args: |
            VITE_BACKEND_URL=

  create-tag:
    needs: [version, build-backend, build-frontend]
    if: needs.version.outputs.is_new_tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create and push version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ needs.version.outputs.version }}"
          git push origin "${{ needs.version.outputs.version }}"

  release:
    needs: [version, build-backend, build-frontend, create-tag]
    if: always() && needs.build-backend.result == 'success' && needs.build-frontend.result == 'success' && (needs.create-tag.result == 'success' || needs.create-tag.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.version }}
          generate_release_notes: true

  pin-compose:
    needs: [version, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.DEPLOY_ADMIN_TOKEN }}

      - name: Pin docker-compose.yml to the released version
        run: |
          sed -i -E "s#(image: ${{ env.BACKEND_IMAGE }}:).*#\1${{ needs.version.outputs.version }}#" docker-compose.yml
          sed -i -E "s#(image: ${{ env.FRONTEND_IMAGE }}:).*#\1${{ needs.version.outputs.version }}#" docker-compose.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docker-compose.yml
          if git diff --cached --quiet; then
            echo "docker-compose.yml already pinned to ${{ needs.version.outputs.version }}, nothing to commit."
          else
            git commit -m "chore(deploy): pin images to ${{ needs.version.outputs.version }} [skip ci]"
            git push origin HEAD:main
          fi

  deploy:
    needs: [pin-compose]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Portainer stack redeploy
        run: curl -fsS -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
